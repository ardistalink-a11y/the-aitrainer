name: Scrape proyek

on:
  schedule:
    - cron: '0 23 * * *'   # tiap hari 06:00 WIB
  workflow_dispatch:        # tombol "Run workflow" untuk tes manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Lever (Welo, Appen, RWS, TSMG)
        run: node lever.mjs
      - name: Ashby (Lilt)
        if: always()
        run: node ashby.mjs
      - name: Mercor
        if: always()
        run: node mercor.mjs
      - name: OneForma
        if: always()
        run: node oneforma.mjs
      - name: Install browser
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Additional platforms
        if: always()
        run: node additional-platforms.mjs
      - name: Outlier
        if: always()
        run: node outlier.mjs
      - name: Backfill country codes
        if: always()
        continue-on-error: true
        run: node backfill-countries.mjs
